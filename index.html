<!DOCTYPE html>
<html>
<head>
    <title>Zyphor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <h2>Zyphor</h2>

    <div class="categories">
        <a href="#" class="circle" onclick="toggleSection('clothes')">Clothes</a>
        <a href="#" class="circle" onclick="toggleSection('accessories')">Accessories</a>
    </div>
</nav>

<h1>Stuff</h1>

<div class="products">
    <div class="product">
        <h3>Product A</h3>
        <p>€35</p>
    </div>

    <div class="product">
        <h3>Product B</h3>
        <p>€45</p>
    </div>

    <div class="product">
        <h3>Product C</h3>
        <p>€20</p>
    </div>
</div>

<!-- DROPDOWN SECTIONS -->

<div id="clothes" class="dropdown">
    <h2>Clothes</h2>
    <div class="products">
        <div class="product">
            <h3>Vintage Hoodie</h3>
            <p>€40</p>
        </div>

        <div class="product">
            <h3>Baggy Jeans</h3>
            <p>€55</p>
        </div>
    </div>
</div>

<div id="accessories" class="dropdown">
    <h2>Accessories</h2>
    <div class="products">
        <div class="product">
            <h3>Chain</h3>
            <p>€20</p>
        </div>

        <div class="product">
            <h3>Cap</h3>
            <p>€15</p>
        </div>
    </div>
</div>

<script>
function toggleSection(id) {
    let section = document.getElementById(id);

    document.querySelectorAll(".dropdown").forEach(el => {
        if (el.id !== id) {
            el.classList.remove("active");
        }
    });

    section.classList.toggle("active");
}
</script>

</body>
</html>
